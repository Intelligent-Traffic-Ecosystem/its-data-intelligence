#logscotrol -warnings/errors only show[alembic]
script_location = migrations
sqlalchemy.url = postgresql://user:pass@localhost:5434/traffic

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
#too much noise avoid
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

#This file configures Alembic to connect to the PostgreSQL database, locate migration scripts, and control logging output for migrations and SQL operations
#alembc tool .database migrations manage