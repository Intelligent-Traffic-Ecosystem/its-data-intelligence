services:
  # --- Shared Infrastructure (for local B2 development) ---
  kafka:
    image: soldevelo/kafka
    ports:
      - "29093:29092"   # EXTERNAL — for clients on the host (mock_producer venv, kafka-ui, debug tools)
    environment:
      # soldevelo/kafka is Bitnami-derived → requires KAFKA_CFG_* prefix
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      # Two PLAINTEXT-style listeners: PLAINTEXT for inside docker, EXTERNAL for host
      KAFKA_CFG_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29093
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      # Kafka 4.1+ standalone: no QUORUM_VOTERS — auto-configures
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_KRAFT_CLUSTER_ID: "b2-local-dev-cluster-001"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: traffic
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - pgdata:/var/lib/postgresql/data

  # --- B2 Services ---
  jobmanager:
    build:
      context: .
      dockerfile: docker/Dockerfile.processor
    command: standalone-job --python /app/processor/main.py
    ports:
      - "8081:8081"
    depends_on:
      - kafka
      - postgres
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC_INPUT=traffic.events.raw
      - POSTGRES_URL=postgresql://user:pass@postgres:5432/traffic
    restart: on-failure

  taskmanager:
    build:
      context: .
      dockerfile: docker/Dockerfile.processor
    command: taskmanager
    depends_on:
      - jobmanager
      - kafka
      - postgres
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
      - KAFKA_BROKERS=kafka:9092
      - KAFKA_TOPIC_INPUT=traffic.events.raw
      - POSTGRES_URL=postgresql://user:pass@postgres:5432/traffic
    restart: on-failure

  b2-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    depends_on:
      - postgres
    ports:
      - "18000:8000"
    environment:
      POSTGRES_URL: postgresql://user:pass@postgres:5432/traffic
    restart: on-failure

volumes:
  pgdata:
